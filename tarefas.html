<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <header class="flex justify-between items-center py-4 px-15 bg-gradient-to-r from-purple-900 via-purple-600 to-purple-900">
        <input type="text" placeholder="Pesquisar" class="w-100 h-10 pl-4 rounded bg-white"/>
        <button class="leading-10 bg-purple-800 rounded px-4 font-bold text-white duration-200 cursor-pointer hover:bg-purple-400 hover:text-black">Nova Tarefa</button>
    </header>

    <main class="p-15 bg-slate-200">
        <h1 class="text-3xl font-bold mb-6">Tarefas</h1>
        <div id="tarefas" class="grid grid-cols-3 gap-4">
        </div>
        <div id="overlay" class="w-full h-screen bg-black/70 fixed top-0 left-0"></div>
        <div id="form-criar" class="w-100 p-4 rounded-lg bg-white"></div>
        <form class="flex flex-col">
            <label
             for="titulo"
             class="uppercase text-xs font-bold mb-2 block">Titulo</label>
             input
        </form>

    </main>

    <script src="index.js"></script>
</body>

</html>
